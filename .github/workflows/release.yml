name: Release

# Fires on v* tags. Fails fast when the tag doesn't match versionName, so a
# mistagged release can never ship. Creates a DRAFT release with the named
# APKs attached — the owner reviews the notes and clicks publish.
#
# Optional signing: when the four secrets below are set, the APKs are signed
# with the release keystore; otherwise the build is unsigned (installable
# only for testing). Secrets expected:
#   KEYSTORE_BASE64   - base64 of chanting-buddy-release.jks
#   KEYSTORE_PASSWORD - keystore (store) password
#   KEY_ALIAS         - key alias
#   KEY_PASSWORD      - key password

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify tag matches versionName
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME versionName=$VERSION"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi

      - name: Decode signing keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/chanting-buddy-release.jks
          else
            echo "No KEYSTORE_BASE64 secret; building unsigned APKs"
          fi

      - name: Write keystore.properties (if secrets provided)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../keystore/chanting-buddy-release.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > keystore.properties
          fi

      - name: Test and build release APKs
        run: ./gradlew test assembleRelease

      - name: Create draft release with APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Chanting Buddy ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            app/build/outputs/release-named/*.apk
