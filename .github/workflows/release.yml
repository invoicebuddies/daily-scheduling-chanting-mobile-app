name: Release

# Fires on v* tags. Publishes NOTHING unless every APK is signed with the
# expected release certificate:
#   1. The job fails up front when any signing secret is missing — an
#      unsigned release can never ship (unsigned APKs don't install at all).
#   2. The decoded keystore's certificate must match the repo variable
#      EXPECTED_CERT_SHA256 before any build runs.
#   3. After the build, apksigner verifies every attached APK against the
#      same hash; any mismatch or unsigned file fails the job.
# Creates a DRAFT release with the named APKs attached — the owner reviews
# the notes and clicks publish.
#
# Secrets expected (repo → Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   - base64 of chanting-buddy-release.jks
#   KEYSTORE_PASSWORD - keystore (store) password
#   KEY_ALIAS         - key alias
#   KEY_PASSWORD      - key password
# Variables expected:
#   EXPECTED_CERT_SHA256 - SHA-256 of the signing certificate (see RELEASING.md)

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify tag matches versionName
        run: |
          # Tags ending in -test exercise the pipeline without a version bump;
          # they can only ever produce a draft, so skip the match check there.
          if [[ "$GITHUB_REF_NAME" == *-test ]]; then
            echo "Test tag $GITHUB_REF_NAME — skipping versionName match"
            exit 0
          fi
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME versionName=$VERSION"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required signing secrets: ${missing[*]}. An unsigned release must never ship — Android refuses to install unsigned APKs. See RELEASING.md."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/chanting-buddy-release.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../keystore/chanting-buddy-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > keystore.properties

      - name: Verify keystore certificate matches expected hash
        env:
          EXPECTED: ${{ vars.EXPECTED_CERT_SHA256 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$EXPECTED" ]; then
            echo "::error::Repo variable EXPECTED_CERT_SHA256 is not set. See RELEASING.md."
            exit 1
          fi
          actual=$(keytool -list -v -keystore keystore/chanting-buddy-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256://' | tr -d ' \t\r:' | tr 'A-F' 'a-f')
          if [ "$actual" != "$(echo "$EXPECTED" | tr 'A-F' 'a-f' | tr -d ' \n')" ]; then
            echo "::error::Keystore certificate SHA-256 ($actual) does not match EXPECTED_CERT_SHA256. Refusing to ship an APK users can't install over previous releases."
            exit 1
          fi
          echo "Keystore certificate verified: $actual"

      - name: Test and build release APKs
        run: ./gradlew test assembleRelease

      - name: Verify every APK is signed with the expected certificate
        env:
          EXPECTED: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          signer_dir=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          shopt -s nullglob
          apks=(app/build/outputs/release-named/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No APKs found in app/build/outputs/release-named/"
            exit 1
          fi
          expected=$(echo "$EXPECTED" | tr 'A-F' 'a-f' | tr -d ' \n')
          for apk in "${apks[@]}"; do
            out=$("$signer_dir/apksigner" verify --print-certs "$apk")
            sha=$(echo "$out" | grep -i 'SHA-256 digest' | grep -oiE '[0-9a-f]{64}' | head -1 | tr 'A-F' 'a-f')
            if [ -z "$sha" ]; then
              echo "::error::$apk is NOT signed. Refusing to attach it to a release."
              exit 1
            fi
            if [ "$sha" != "$expected" ]; then
              echo "::error::$apk certificate mismatch: got $sha, expected $expected."
              exit 1
            fi
            echo "Verified $apk (cert $sha)"
          done

      - name: Clean up signing material
        if: always()
        run: rm -f keystore/chanting-buddy-release.jks keystore.properties

      - name: Create draft release with APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Chanting Buddy ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            app/build/outputs/release-named/*.apk
